services:
  - type: web
    name: carecircle-platform
    env: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
